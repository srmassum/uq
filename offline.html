<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Qatar Unseen</title>
<meta name="robots" content="noindex">
<!--
  Shown by sw.js when a navigation fails and there is no cached copy of the page
  that was asked for.

  A plain file rather than a PHP page, and with its colours written out rather
  than read from the stylesheet, because the situation it exists for is the one
  where nothing else arrives: no server, and quite possibly no cached CSS.

  It follows the device's own light/dark setting the same way the site does,
  which is the one piece of the site's behaviour it can still honour.
-->
<style>
  :root {
    --bg: #fbfaf9; --surface: #ffffff; --ink: #1c1917;
    --ink-soft: #78716c; --line: #e7e5e4; --brand: #8b1538;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --surface: #1a1715; --ink: #fafaf9;
      --ink-soft: #a8a29e; --line: #2e2a28; --brand: #c2415f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    padding: 24px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 32px; max-width: 460px; text-align: center;
  }
  .mark {
    inline-size: 52px; block-size: 52px; border-radius: 14px;
    background: var(--brand); margin: 0 auto 20px;
    position: relative;
  }
  .mark::after {
    content: ""; position: absolute; inset: 14px;
    border-radius: 4px;
    background: linear-gradient(160deg, #fff 0 45%, transparent 45%);
  }
  h1 { font-size: 1.35rem; line-height: 1.25; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { margin: 0 0 14px; color: var(--ink-soft); }
  p:last-child { margin-block-end: 0; }
  button, a.btn {
    display: inline-block; margin-block-start: 8px;
    padding: 11px 20px; border-radius: 99px; border: 0;
    background: var(--brand); color: #fff;
    font: inherit; font-weight: 550; text-decoration: none; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>You are offline</h1>
    <p>This page was not saved on your device, and there is no connection to fetch it.</p>
    <p>Everything else still works — the map you built, the places you marked and the trip you are planning are all kept in this browser, not on a server.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
