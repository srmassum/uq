<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Qatar Unseen">
  <!--
    The maskable variant. The platform crops this one to whatever shape it likes
    — a circle on Android, a squircle on some launchers — so the background runs
    to all four edges with no rounding of its own, and the mark sits inside the
    middle 80% that every mask is guaranteed to keep.

    Same shape as icon.svg, sized down so the crop cannot cut into it.
  -->
  <rect width="512" height="512" fill="#8b1538"/>
  <g transform="translate(-20.3 -32) scale(18)" fill="#fff">
    <path d="M9 22V10h4.6c3.1 0 5 1.6 5 4.3 0 2-1 3.4-2.7 4l3.1 3.7h-3l-2.6-3.3h-1.5V22H9zm2.9-5.7h1.6c1.4 0 2.2-.7 2.2-1.9s-.8-1.9-2.2-1.9h-1.6v3.8z"/>
  </g>
</svg>
