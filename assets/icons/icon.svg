<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Qatar Unseen">
  <!--
    The app icon: the same maroon tile and the same letter mark the favicon and
    the header square already use, at install size.

    One path serves both, so the mark in a browser tab and the mark on a home
    screen are the same shape rather than two drawings of the same idea.

    An SVG rather than a PNG pair because nothing in this project can make a PNG
    without GD, and GD is not guaranteed on a XAMPP install. Chrome, Edge and
    Android take this at any size, which covers every platform that shows an
    install prompt. iOS is the exception: it wants a 180x180 PNG for the home
    screen and shows a screenshot of the page without one.
  -->
  <rect width="512" height="512" rx="112" fill="#8b1538"/>
  <g transform="translate(10.4 0) scale(16)" fill="#fff">
    <path d="M9 22V10h4.6c3.1 0 5 1.6 5 4.3 0 2-1 3.4-2.7 4l3.1 3.7h-3l-2.6-3.3h-1.5V22H9zm2.9-5.7h1.6c1.4 0 2.2-.7 2.2-1.9s-.8-1.9-2.2-1.9h-1.6v3.8z"/>
  </g>
</svg>
